<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로또 번호 자동 생성기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033;font-family:Arial,'Malgun Gothic',sans-serif}.wrap{max-width:720px;margin:28px auto;padding:24px;background:white;border:1px solid #e5e9f0;border-radius:20px;box-shadow:0 10px 28px #10223b10}h1{font-size:27px;margin:0 0 9px}.sub{font-size:14px;color:#637084;line-height:1.6;margin-bottom:25px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}label{font-weight:700}select{padding:10px 15px;border:1px solid #cfd6e2;border-radius:10px;font-size:16px}button{cursor:pointer;border:0;border-radius:12px;font-weight:700;padding:13px 20px;font-size:16px}#draw{background:#273dd9;color:white}#copy{background:#e9edfc;color:#293ba4}#results{display:grid;gap:12px;margin:23px 0}.game{border:1px solid #e8edf4;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.game b{font-size:13px;color:#5a6576;min-width:62px}.balls{display:flex;gap:7px;flex-wrap:wrap}.ball{display:inline-flex;align-items:center;justify-content:center;width:43px;height:43px;border-radius:50%;color:white;font-weight:800;font-size:16px;box-shadow:inset 0 -5px 8px #0002,0 2px 4px #0001}.c1{background:#e6aa00}.c2{background:#3887db}.c3{background:#e75759}.c4{background:#78828d}.c5{background:#37a36a}.fine{font-size:12px;line-height:1.6;color:#67758a;margin:10px 0 0}@media(max-width:480px){.wrap{margin:12px;padding:18px}.ball{width:37px;height:37px;font-size:14px}.game{gap:9px}.game b{min-width:100%}}
</style></head><body><main class="wrap"><h1>🎱 로또 번호 자동 생성기</h1><p class="sub">1~45 사이에서 중복 없이 6개를 무작위 추첨합니다. 버튼만 누르면 새 번호가 만들어져요.</p><div class="controls"><label for="count">게임 수</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select><button id="draw">번호 자동 생성</button><button id="copy">번호 복사</button></div><div id="results" aria-live="polite"></div><p class="fine">※ 오락·참고용입니다. 당첨번호를 예측하지 않으며, 모든 6개 번호 조합의 1등 확률은 동일합니다(1/8,145,060). 본 프로그램은 실제 복권을 구매하지 않습니다.</p></main><script>
const output=document.getElementById('results');let latest=[];function secureInt(max){const range=4294967296,cut=range-(range%max),a=new Uint32Array(1);let n;do{crypto.getRandomValues(a);n=a[0]}while(n>=cut);return n%max}function sample(){const a=Array.from({length:45},(_,i)=>i+1);for(let i=0;i<6;i++){const j=i+secureInt(45-i);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,6).sort((a,b)=>a-b)}function color(n){return 'c'+(n<=10?1:n<=20?2:n<=30?3:n<=40?4:5)}function render(){latest=[];const count=Number(document.getElementById('count').value),seen=new Set();while(latest.length<count){const values=sample(),key=values.join(',');if(!seen.has(key)){seen.add(key);latest.push(values)}}output.replaceChildren();latest.forEach((nums,i)=>{const game=document.createElement('div');game.className='game';const title=document.createElement('b');title.textContent=`${i+1}게임`;const balls=document.createElement('div');balls.className='balls';nums.forEach(n=>{const el=document.createElement('span');el.className='ball '+color(n);el.textContent=n;balls.append(el)});game.append(title,balls);output.append(game)})}document.getElementById('draw').addEventListener('click',render);document.getElementById('copy').addEventListener('click',async()=>{if(!latest.length)return;const text=latest.map((a,i)=>`${i+1}게임: ${a.join(', ')}`).join('\n');try{await navigator.clipboard.writeText(text);document.getElementById('copy').textContent='복사 완료';setTimeout(()=>document.getElementById('copy').textContent='번호 복사',1400)}catch(e){window.prompt('아래 번호를 복사하세요',text)}});render();
</script></body></html>
